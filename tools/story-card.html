<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>限動分享圖模板</title>
<!--
  IG 限時動態分享圖模板（1080 × 1920，9:16）
  用法：tools/story-card.html?key=lavender
  產圖：bash tools/render-story-images.sh（輸出到 share/<key>.png）

  設計：森林全幅背景＋一張奶油色主卡，卡內不再套框，用字級與留白分層。
    1. 身分（我是誰）：植物名＋副標那句話＋人格標籤 → 讓人想分享
    2. 座標（我在哪）：象限圖只放兩個點，說明放右側圖例 → 清楚
    3. 本命香（為什麼是這支）：香名放大＋那句話 → 認同感、想擁有
    4. 卡片下方森林上：測驗呼籲，再往下留空給「連結」貼圖
  卡片右上用植物自己的顏色做暈染，象限底色也用植物色，六張圖各有個性。
  安全區：上方約 250px、下方約 250px 會被 IG 介面蓋住。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #24331f; }
  body { font-family: 'Noto Serif TC', serif; color: #2b3a2b; }

  .story { position: relative; width: 1080px; height: 1920px; overflow: hidden;
           background: url('../images/forest-bg.jpg') center / cover no-repeat; }
  .story::before { content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(28,40,28,0.55) 0%, rgba(28,40,28,0.2) 35%, rgba(28,40,28,0.35) 70%, rgba(20,30,20,0.75) 100%); }

  .brand .zh { font-family: 'Noto Serif TC', serif; font-size: 30px; font-weight: 700; letter-spacing: 6px; margin-right: 18px; vertical-align: -2px; }
  .brand { position: absolute; top: 190px; left: 0; right: 0; text-align: center;
           font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 24px; letter-spacing: 9px; color: #f3eadb; }

  /* 主卡 */
  .card { position: absolute; top: 250px; left: 60px; right: 60px;
          background: #faf5ec; border-radius: 44px; overflow: hidden;
          padding: 54px 64px 50px; box-shadow: 0 30px 80px rgba(0,0,0,0.35); }
  .wash { position: absolute; width: 760px; height: 760px; right: -300px; top: -300px; border-radius: 50%;
          background: radial-gradient(circle, var(--c) 0%, transparent 65%); opacity: 0.38; pointer-events: none; }
  .card > *:not(.wash) { position: relative; }

  /* 1. 身分 */
  .plant { position: absolute !important; right: 40px; top: 46px; width: 230px; height: 230px; object-fit: contain;
           filter: drop-shadow(0 10px 20px rgba(0,0,0,0.08)); }
  .kicker { font-size: 26px; color: #8b7355; letter-spacing: 4px; }
  .name { font-size: 104px; font-weight: 900; line-height: 1.1; margin-top: 4px; letter-spacing: 2px; }
  .identity { font-size: 42px; font-weight: 500; margin-top: 16px; line-height: 1.35; }
  .tags { font-size: 26px; color: #8b7355; margin-top: 14px; letter-spacing: 1px; }
  .tags span + span { margin-left: 20px; }

  .rule { border-top: 2px solid rgba(139,115,85,0.22); margin: 36px 0; }

  /* 2. 座標 */
  .coord { display: flex; gap: 46px; align-items: center; }
  .map { position: relative; flex: 0 0 340px; height: 340px; }
  .quad { position: absolute; width: 50%; height: 50%; padding: 12px 14px; font-size: 18px; line-height: 1.3;
          color: rgba(139,115,85,0.6); background: #f2ebdf; }
  .quad.on { background: color-mix(in srgb, var(--c) 24%, #fffdf8); color: #2b3a2b; font-weight: 700; }
  .q-tl { left: 0; top: 0; border-top-left-radius: 20px; }
  .q-tr { right: 0; top: 0; text-align: right; border-top-right-radius: 20px; }
  .q-bl { left: 0; bottom: 0; display: flex; align-items: flex-end; border-bottom-left-radius: 20px; }
  .q-br { right: 0; bottom: 0; display: flex; align-items: flex-end; justify-content: flex-end; text-align: right; border-bottom-right-radius: 20px; }
  .ax-v { position: absolute; left: 50%; top: 0; bottom: 0; border-left: 3px solid #faf5ec; }
  .ax-h { position: absolute; top: 50%; left: 0; right: 0; border-top: 3px solid #faf5ec; }
  .pt { position: absolute; width: 34px; height: 34px; border-radius: 50%; transform: translate(-50%,-50%);
        background: var(--c); border: 6px solid #fff; box-shadow: 0 0 0 2px var(--c), 0 6px 16px rgba(0,0,0,0.18); z-index: 2; }
  .star { position: absolute; transform: translate(-50%,-52%); font-size: 44px; line-height: 1; color: #6f5a42;
          text-shadow: 0 0 10px #fffdf8, 0 0 4px #fffdf8; z-index: 3; }

  .legend { flex: 1; }
  .legend .lbl { font-size: 24px; color: #8b7355; letter-spacing: 2px; }
  .legend .zone { font-size: 48px; font-weight: 900; margin-top: 4px; line-height: 1.2; }
  .legend .en { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 32px; color: #8b7355; }
  .legend .keys { margin-top: 22px; font-size: 26px; line-height: 1.9; }
  .legend .keys .dot { display: inline-block; width: 20px; height: 20px; border-radius: 50%; background: var(--c);
                        border: 4px solid #fff; box-shadow: 0 0 0 2px var(--c); vertical-align: -2px; margin-right: 12px; }
  .legend .keys .st { color: #6f5a42; margin-right: 10px; }
  .legend .keys .num { font-size: 22px; color: #8b7355; margin-left: 6px; }

  /* 3. 本命香 */
  .soul .lbl { font-size: 26px; color: #8b7355; letter-spacing: 4px; }
  .soul .lbl b { color: #6f5a42; }
  .soul .scent { display: flex; align-items: baseline; gap: 20px; margin-top: 4px; }
  .soul .zh { font-size: 86px; font-weight: 900; line-height: 1.15; letter-spacing: 4px; }
  .soul .en { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 40px; color: #8b7355; }
  .soul .quote { font-size: 30px; line-height: 1.75; margin-top: 14px; color: #3b3328; }
  .soul .pair { font-size: 26px; color: #8b7355; margin-top: 14px; letter-spacing: 1px; }
  .soul .pair b { color: #2b3a2b; font-weight: 700; margin-left: 6px; }
  .soul .pair i { font-family: 'Cormorant Garamond', serif; font-size: 27px; margin-left: 8px; }

  .rels { display: flex; flex-wrap: wrap; gap: 8px 36px; font-size: 25px; margin-top: 30px; }
  .rels span { color: #8b7355; margin-right: 10px; }
  .rels b { font-weight: 700; }

  /* 4. 測驗呼籲（森林上） */
  .cta { position: absolute; left: 0; right: 0; text-align: center; color: #fbf6ee; }
  .cta .q { font-size: 46px; font-weight: 700; letter-spacing: 2px; text-shadow: 0 2px 14px rgba(0,0,0,0.4); }
  .cta .meta { font-size: 25px; color: #e6dac6; margin-top: 8px; letter-spacing: 1px; }
  .cta .hint { font-size: 27px; margin-top: 8px; opacity: 0.95; }
</style>
</head>
<body>
<div class="story" id="story">
  <div class="brand"><span class="zh">煖意</span>NUVAYAE SCENT LAB</div>

  <div class="card" id="card">
    <div class="wash"></div>
    <img class="plant" id="img" alt="">

    <div class="kicker">我的情緒座標植物</div>
    <div class="name" id="name"></div>
    <div class="identity" id="identity"></div>
    <div class="tags" id="tags"></div>

    <div class="rule"></div>

    <div class="coord">
      <div class="map">
        <div class="quad q-tl" data-q="tl"><span>光合啟動區</span></div>
        <div class="quad q-tr" data-q="tr"><span>熱烈綻放區</span></div>
        <div class="quad q-bl" data-q="bl"><span>安定靜心區</span></div>
        <div class="quad q-br" data-q="br"><span>溫潤和諧區</span></div>
        <div class="ax-v"></div><div class="ax-h"></div>
        <div class="pt" id="pt"></div>
        <div class="star" id="star">★</div>
      </div>
      <div class="legend">
        <div class="lbl">我現在站在</div>
        <div class="zone" id="zone"></div>
        <div class="en" id="axes"></div>
        <div class="keys">
          <div><span class="dot"></span>我</div>
          <div><span class="st">★</span><span id="starName"></span><span class="num" id="starNum"></span></div>
        </div>
      </div>
    </div>

    <div class="rule"></div>

    <div class="soul">
      <div class="lbl">我的本命香 <b>★</b></div>
      <div class="scent"><span class="zh" id="scentZh"></span><span class="en" id="scentEn"></span></div>
      <div class="quote" id="quote"></div>
      <div class="pair">搭配香｜<b id="pairZh"></b><i id="pairEn"></i></div>
    </div>

    <div class="rels">
      <div><span>另一半</span><b id="relPartner"></b></div>
      <div><span>朋友</span><b id="relFriend"></b></div>
      <div><span>天敵</span><b id="relEnemy"></b></div>
    </div>
  </div>

  <div class="cta" id="cta">
    <div class="q">你現在是哪一種植物？</div>
    <div class="meta">@nuvayae.scent.lab ・ reurl.cc/GGozMW</div>
    <div class="hint">心情不同，答案也不同｜10 題測測看 👇</div>
  </div>
  <!-- CTA 下方留空給使用者放「連結」貼圖 -->
</div>

<script type="module">
  import { plantData, products, getPlantImage, pcaToPercent, plantPca, formatPca } from '../js/data/plants.js';
  const key = new URLSearchParams(location.search).get('key') || 'lavender';
  const d = plantData[key];
  const featured = d.scent.featured || 'similar';
  const main = products[d.scent[featured].product];
  const $ = id => document.getElementById(id);

  $('story').style.setProperty('--c', d.color);
  $('img').src = '../' + getPlantImage(key);
  $('name').textContent = d.name;
  const [axes, identity] = d.tagline.split('｜');
  $('identity').textContent = identity;
  $('tags').innerHTML = d.persona.traits.map(t => `<span>#${t}</span>`).join('');

  $('zone').textContent = d.field.split(' ')[0];
  $('axes').textContent = axes.trim();

  const me = plantPca(d);
  const q = (me.y >= 0 ? 't' : 'b') + (me.x >= 0 ? 'r' : 'l');
  document.querySelector(`[data-q="${q}"]`).classList.add('on');
  Object.assign($('pt').style, { left: d.coord.x + '%', top: d.coord.y + '%' });
  const sp = pcaToPercent(main.pca);
  Object.assign($('star').style, { left: sp.left + '%', top: sp.top + '%' });

  const [scentZh, ...scentEn] = main.name.split(' ');
  $('starName').textContent = scentZh;
  $('starNum').textContent = formatPca(main.pca);
  $('scentZh').textContent = scentZh;
  $('scentEn').textContent = scentEn.join(' ');
  $('quote').textContent = d.persona.line;
  const other = featured === 'similar' ? 'balance' : 'similar';
  const [pairZh, ...pairEn] = products[d.scent[other].product].name.split(' ');
  $('pairZh').textContent = pairZh;
  $('pairEn').textContent = pairEn.join(' ');

  const names = keys => keys.map(k => plantData[k].name).join('、');
  $('relPartner').textContent = names(d.relationships.partner.plants);
  $('relFriend').textContent = names(d.relationships.friend.plants);
  $('relEnemy').textContent = names(d.relationships.enemy.plants);

  // 呼籲放在卡片下方 36px
  await document.fonts.ready;
  const card = $('card');
  $('cta').style.top = (card.offsetTop + card.offsetHeight + 36) + 'px';
</script>
</body>
</html>
