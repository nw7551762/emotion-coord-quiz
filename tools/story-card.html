<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>限動分享圖模板</title>
<!--
  IG 限時動態分享圖模板（1080 × 1920，9:16）
  用法：tools/story-card.html?key=lavender
  產圖：bash tools/render-story-images.sh（輸出到 share/<key>.png）

  設計：雜誌海報式，去掉外框與卡片，用字級和留白分層。
    1. 身分（我是誰）：植物名＋副標那句話＋人格標籤 → 讓人想分享
    2. 座標（我在哪）：象限圖只放兩個點，說明放右側圖例 → 清楚
    3. 本命香（為什麼是這支）：香名放大＋那句話 → 認同感、想擁有
    4. 底部森林帶：測驗呼籲，下方留空給「連結」貼圖
  每種植物用自己的顏色做背景暈染與象限底色，六張圖各有個性。
  安全區：上方約 250px、下方約 250px 會被 IG 介面蓋住。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { font-family: 'Noto Serif TC', serif; color: #2b3a2b; background: #f6efe4; }

  .story { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #f6efe4; }
  /* 植物色暈染：每張圖自己的氛圍 */
  .wash { position: absolute; width: 1100px; height: 1100px; right: -380px; top: -160px; border-radius: 50%;
          background: radial-gradient(circle, var(--c) 0%, transparent 62%); opacity: 0.32; }
  .grain { position: absolute; inset: 0; background: radial-gradient(rgba(139,115,85,0.05) 1px, transparent 1px); background-size: 6px 6px; }

  .inner { position: absolute; left: 90px; right: 90px; top: 0; }

  .brand { position: absolute; top: 196px; left: 90px; font-family: 'Cormorant Garamond', serif; font-weight: 600;
           font-size: 24px; letter-spacing: 8px; color: #8b7355; }

  /* 1. 身分 */
  .hero { position: absolute; top: 262px; left: 90px; right: 90px; }
  .kicker { font-size: 28px; color: #8b7355; letter-spacing: 4px; }
  .name { font-size: 118px; font-weight: 900; line-height: 1.1; margin-top: 6px; letter-spacing: 2px; }
  .identity { font-size: 46px; font-weight: 500; margin-top: 18px; line-height: 1.35; }
  .tags { font-size: 28px; color: #8b7355; margin-top: 18px; letter-spacing: 1px; }
  .tags span + span { margin-left: 22px; }
  .plant { position: absolute; right: 70px; top: 270px; width: 270px; height: 270px; object-fit: contain;
           filter: drop-shadow(0 12px 24px rgba(0,0,0,0.08)); }

  .rule { position: absolute; left: 90px; right: 90px; height: 0; border-top: 2px solid rgba(139,115,85,0.25); }

  /* 2. 座標 */
  .coord { position: absolute; top: 700px; left: 90px; right: 90px; display: flex; gap: 52px; align-items: center; }
  .map { position: relative; flex: 0 0 380px; height: 380px; }
  .quad { position: absolute; width: 50%; height: 50%; padding: 14px 16px; font-size: 19px; line-height: 1.3;
          color: rgba(139,115,85,0.55); background: rgba(255,253,248,0.55); }
  .quad.on { background: color-mix(in srgb, var(--c) 22%, #fffdf8); color: #2b3a2b; font-weight: 700; }
  .q-tl { left: 0; top: 0; border-top-left-radius: 22px; }
  .q-tr { right: 0; top: 0; text-align: right; border-top-right-radius: 22px; }
  .q-bl { left: 0; bottom: 0; display: flex; align-items: flex-end; border-bottom-left-radius: 22px; }
  .q-br { right: 0; bottom: 0; display: flex; align-items: flex-end; justify-content: flex-end; text-align: right; border-bottom-right-radius: 22px; }
  .ax-v { position: absolute; left: 50%; top: 0; bottom: 0; border-left: 2px solid rgba(139,115,85,0.35); }
  .ax-h { position: absolute; top: 50%; left: 0; right: 0; border-top: 2px solid rgba(139,115,85,0.35); }
  .pt { position: absolute; width: 36px; height: 36px; border-radius: 50%; transform: translate(-50%,-50%);
        background: var(--c); border: 6px solid #fff; box-shadow: 0 0 0 2px var(--c), 0 6px 18px rgba(0,0,0,0.18); z-index: 2; }
  .star { position: absolute; transform: translate(-50%,-52%); font-size: 46px; line-height: 1; color: #6f5a42;
          text-shadow: 0 0 10px #fffdf8, 0 0 4px #fffdf8; z-index: 3; }

  .legend { flex: 1; }
  .legend .lbl { font-size: 26px; color: #8b7355; letter-spacing: 2px; }
  .legend .zone { font-size: 52px; font-weight: 900; margin-top: 6px; line-height: 1.2; }
  .legend .en { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 34px; color: #8b7355; margin-top: 2px; }
  .legend .keys { margin-top: 26px; font-size: 27px; line-height: 1.9; }
  .legend .keys .dot { display: inline-block; width: 22px; height: 22px; border-radius: 50%; background: var(--c);
                        border: 4px solid #fff; box-shadow: 0 0 0 2px var(--c); vertical-align: -3px; margin-right: 12px; }
  .legend .keys .st { color: #6f5a42; margin-right: 10px; }
  .legend .keys .num { font-size: 23px; color: #8b7355; margin-left: 6px; }
  .legend .move { font-size: 23px; color: #8b7355; margin-top: 14px; }

  /* 3. 本命香 */
  .soul { position: absolute; top: 1140px; left: 90px; right: 90px; }
  .soul .lbl { font-size: 28px; color: #8b7355; letter-spacing: 4px; }
  .soul .lbl b { color: #6f5a42; }
  .soul .scent { display: flex; align-items: baseline; gap: 22px; margin-top: 8px; }
  .soul .zh { font-size: 92px; font-weight: 900; line-height: 1.1; letter-spacing: 4px; }
  .soul .en { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 44px; color: #8b7355; }
  .soul .quote { font-size: 32px; line-height: 1.75; margin-top: 18px; color: #3b3328; }

  .rels { position: absolute; top: 1508px; left: 90px; right: 90px; display: flex; gap: 40px; font-size: 26px; }
  .rels span { color: #8b7355; margin-right: 10px; }
  .rels b { font-weight: 700; }

  /* 4. 底部森林帶 */
  .band { position: absolute; left: 0; right: 0; top: 1590px; bottom: 0;
          background: linear-gradient(180deg, rgba(31,43,31,0.86), rgba(31,43,31,0.96)), url('../images/forest-bg.jpg') center 70% / cover; }
  .cta { position: absolute; left: 0; right: 0; top: 1622px; text-align: center; color: #fbf6ee; }
  .cta .q { font-size: 44px; font-weight: 700; letter-spacing: 2px; }
  .cta .meta { font-size: 25px; color: #d9cbb3; margin-top: 8px; letter-spacing: 1px; }
  .cta .hint { font-size: 27px; color: #fbf6ee; margin-top: 10px; opacity: 0.9; }
</style>
</head>
<body>
<div class="story" id="story">
  <div class="wash"></div>
  <div class="grain"></div>

  <div class="brand">NUVAYAE SCENT LAB</div>

  <img class="plant" id="img" alt="">
  <div class="hero">
    <div class="kicker">我的情緒座標植物</div>
    <div class="name" id="name"></div>
    <div class="identity" id="identity"></div>
    <div class="tags" id="tags"></div>
  </div>

  <div class="rule" style="top: 660px"></div>

  <div class="coord">
    <div class="map" id="map">
      <div class="quad q-tl" data-q="tl"><span>光合啟動區</span></div>
      <div class="quad q-tr" data-q="tr"><span>熱烈綻放區</span></div>
      <div class="quad q-bl" data-q="bl"><span>安定靜心區</span></div>
      <div class="quad q-br" data-q="br"><span>溫潤和諧區</span></div>
      <div class="ax-v"></div><div class="ax-h"></div>
      <div class="pt" id="pt"></div>
      <div class="star" id="star">★</div>
    </div>
    <div class="legend">
      <div class="lbl">我現在站在</div>
      <div class="zone" id="zone"></div>
      <div class="en" id="axes"></div>
      <div class="keys">
        <div><span class="dot"></span>我</div>
        <div><span class="st">★</span><span id="starName"></span><span class="num" id="starNum"></span></div>
      </div>
    </div>
  </div>

  <div class="rule" style="top: 1110px"></div>

  <div class="soul">
    <div class="lbl">我的本命香 <b>★</b></div>
    <div class="scent"><span class="zh" id="scentZh"></span><span class="en" id="scentEn"></span></div>
    <div class="quote" id="quote"></div>
  </div>

  <div class="rels">
    <div><span>另一半</span><b id="relPartner"></b></div>
    <div><span>朋友</span><b id="relFriend"></b></div>
    <div><span>天敵</span><b id="relEnemy"></b></div>
  </div>

  <div class="band"></div>
  <div class="cta">
    <div class="q">你現在是哪一種植物？</div>
    <div class="meta">@nuvayae.scent.lab ・ reurl.cc/GGozMW</div>
    <div class="hint">心情不同，答案也不同｜10 題測測看 👇</div>
  </div>
  <!-- 1720px 以下留空給使用者放「連結」貼圖 -->
</div>

<script type="module">
  import { plantData, products, getPlantImage, pcaToPercent, plantPca, formatPca } from '../js/data/plants.js';
  const key = new URLSearchParams(location.search).get('key') || 'lavender';
  const d = plantData[key];
  const featured = d.scent.featured || 'similar';
  const main = products[d.scent[featured].product];
  const $ = id => document.getElementById(id);

  document.getElementById('story').style.setProperty('--c', d.color);
  $('img').src = '../' + getPlantImage(key);
  $('name').textContent = d.name;
  const [axes, identity] = d.tagline.split('｜');
  $('identity').textContent = identity;
  $('tags').innerHTML = d.persona.traits.map(t => `<span>#${t}</span>`).join('');

  const zh = d.field.split(' ')[0];
  $('zone').textContent = zh;
  $('axes').textContent = axes.trim();

  const me = plantPca(d);
  const q = (me.y >= 0 ? 't' : 'b') + (me.x >= 0 ? 'r' : 'l');
  document.querySelector(`[data-q="${q}"]`).classList.add('on');
  Object.assign($('pt').style, { left: d.coord.x + '%', top: d.coord.y + '%' });
  const sp = pcaToPercent(main.pca);
  Object.assign($('star').style, { left: sp.left + '%', top: sp.top + '%' });

  const [scentZh, ...scentEn] = main.name.split(' ');
  $('starName').textContent = scentZh;
  $('starNum').textContent = formatPca(main.pca);
  $('scentZh').textContent = scentZh;
  $('scentEn').textContent = scentEn.join(' ');
  $('quote').textContent = d.persona.line;

  const names = keys => keys.map(k => plantData[k].name).join('、');
  $('relPartner').textContent = names(d.relationships.partner.plants);
  $('relFriend').textContent = names(d.relationships.friend.plants);
  $('relEnemy').textContent = names(d.relationships.enemy.plants);
</script>
</body>
</html>
